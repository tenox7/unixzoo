# builds the site and puts it on GitHub Pages on every push to master, eg: a
# merged pull request
name: publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write    # to publish the site
  id-token: write # deploy-pages logs in to Pages with it, keyless

concurrency: publish # one at a time

jobs:
  publish:
    if: github.repository == 'tenox7/unixzoo' # not in forks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build the site
        run: go run . -out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
